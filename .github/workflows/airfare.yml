name: airfare-check

on:
  schedule:
    - cron: "*/30 * * * *"   # script itself decides whether a search is due (see interval_hours)
  workflow_dispatch:
    inputs:
      force:
        description: "Force a search now (uses 1 SerpAPI credit)"
        type: boolean
        default: false
      sample:
        description: "Only send a sample card to Teams (no search credit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: airfare-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Singapore   # night window (00:00-04:00) is evaluated in Singapore time
      PYTHONUTF8: "1"
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      CURRENCY: INR
      MONTHLY_SEARCH_CAP: "240"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check fares
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then
            python airfare_alert.py test
          else
            python airfare_alert.py check ${{ inputs.force && '--force' || '' }}
          fi
      - name: Save state
        run: |
          git config user.name "airfare-bot"
          git config user.email "airfare-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
